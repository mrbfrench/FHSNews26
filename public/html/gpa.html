<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <!-- Inline script to set the theme immediately -->
    <script>
        (function () {
            var savedTheme = localStorage.getItem('selectedTheme') || 'default';
            document.write('<link rel="stylesheet" href="../themes/' + savedTheme + '.css" id="theme-style">');
        })();
    </script>
    <script src="js/gpa.js"></script>
    <link rel="shortcut icon" type="image/ico" href="img/favicon.ico">
    <link rel="stylesheet" href="css/gpa.css">
    <link rel="stylesheet" href="css/global.css">
</head>

<body>

    <div class="wrapper">
        <header>
            <div class="info-title">GPA Calculator</div>
            <a href="/info">
                <div>
                    <img src="../img/questionmark_white.png" alt="?" width="40" height="40">
                </div>
            </a>
        </header>
        <nav>
            <div id="nav-tabs">
                <a id="nav-tabs__home" href="/">
                    <div>
                        <!--gradcap here-->
                        <img class="svg-convert" src="../img/gradcap.svg" alt="Home" width="34" height="34">
                        <span>Home</span>
                    </div>
                </a>
                <a id="nav-tabs__clubs" href="/clubs">
                    <div>
                        <!--settings here-->
                        <img class="svg-convert" src="../img/clubs.svg" alt="Clubs" width="34" height="34">
                        <span>Clubs</span>
                    </div>
                </a>
                <a id="nav-tabs__cal" href="/calendar">
                    <div>
                        <!--calendar here-->
                        <img class="svg-convert" src="../img/calendar.svg" alt="Calendar" width="34" height="34">
                        <span>Calendar</span>
                    </div>
                </a>
            </div>
        </nav>
    </div>
</body>

<script type="text/javascript">
    window.addEventListener('load', function () {
        // Get all img tags with svg-to-inline class
        var imgTags = document.querySelectorAll('.svg-convert');

        // Loop through each tag found
        imgTags.forEach(function (img) {
            var imgURL = img.src;

            // Fetch the SVG
            fetch(imgURL)
                .then(response => response.text())
                .then(data => {
                    // Parse fetched SVG and replace img tag with it
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(data, 'image/svg+xml');
                    img.parentNode.replaceChild(doc.documentElement, img);
                })
                .catch(error => {
                    console.error("Error fetching the SVG: ", error);
                });
        });
    });

    // Function to switch the theme and save the choice in localStorage
    function switchTheme(themeName) {
        const themeLink = document.getElementById('theme-style');
        themeLink.href = `../themes/${themeName}.css`;
    }

    window.addEventListener('DOMContentLoaded', function () {
        // Apply the saved theme when the page loads
        const savedTheme = localStorage.getItem('selectedTheme');
        if (savedTheme) {
            switchTheme(savedTheme);

        }
    });
</script>
<div class="container">
    <div class="option-buttons">
        <h1>GPA Calculator</h1>
        <h3></h3>
        <button onclick="toggleDiv()" style="font-weight: bold;">GPA Calculator</button>
    </div>
    <!-- GPA : Input Grades -->
    <div id="grades-section" class="input-section">
        <h2>Input All Grades</h2>
        <h3>Enter your grades below. Count all AP/Honors classes as <mark>2</mark> credits,
            and input the number of classes you had that were honors or AP respectively at the bottom </h3>
        <div id="inputGrid">
            <div>
                <label>Number of A+'s:</label>
                <input type="number" id="aplus" value="0" min="0">
            </div>

            <div>
                <label>Number of A's:</label>
                <input type="number" id="a" value="0" min="0">
            </div>

            <div>
                <label>Number of A-'s:</label>
                <input type="number" id="aminus" value="0" min="0">
            </div>

            <div>
                <label>Number of B+'s:</label>
                <input type="number" id="bplus" value="0" min="0">
            </div>

            <div>
                <label>Number of B's:</label>
                <input type="number" id="b" value="0" min="0">
            </div>

            <div>
                <label>Number of B-'s:</label>
                <input type="number" id="bminus" value="0" min="0">
            </div>

            <div>
                <label>Number of C+'s:</label>
                <input type="number" id="cplus" value="0" min="0">
            </div>

            <div>
                <label>Number of C's:</label>
                <input type="number" id="c" value="0" min="0">
            </div>

            <div>
                <label>Number of C-'s:</label>
                <input type="number" id="cminus" value="0" min="0">
            </div>

            <div>
                <label>Number of D+'s:</label>
                <input type="number" id="dplus" value="0" min="0">
            </div>

            <div>
                <label>Number of D's:</label>
                <input type="number" id="d" value="0" min="0">
            </div>

            <div>
                <label>Number of D-'s:</label>
                <input type="number" id="dminus" value="0" min="0">
            </div>
            <!--I know this isn't the best way to do it but the empty divs here are to put F's on it's own row and move the other input's down-->
            <div></div>
            <div>
                <label>Number of F's:</label>
                <input type="number" id="f" value="0" min="0">
            </div>
            <div></div>
            <div>
                <label>Semesters Completed:</label>
                <input type="number" id="semesters1" value="1" min="1">
            </div>

            <div>
                <label>Honors Classes (semesters):</label>
                <input type="number" id="honors1" value="0" min="0">
            </div>

            <div>
                <label>AP Classes (semesters):</label>
                <input type="number" id="ap1" value="0" min="0">
            </div>
        </div>
        <!-- Result -->
        <div class="result" id="result"></div>
        <button class="calculate" onclick="calculateGPA()" style="font-weight: bold;">Calculate GPA</button>

    </div>
    <div class="option-buttons">
        <h1>Semester Grade after Final</h1>
        <button style="font-weight: bold;" onclick="toggleDiv2()">Semester Grade with Final</button>
    </div>
    <!-- Final Grade  : Input Grades -->
    <div id="semester-section" class="input-section">
        <h2>Input Semester Grade</h2>
        <label>Class grade for Semester:</label>
        <input type="number" id="semGrade" value="0" min="0" max="100">

        <label>Grade on Final:</label>
        <input type="number" id="finalGrade" value="0" min="0" max="100">

        <!-- Result -->
        <div class="result2" id="result2"></div>
        <button class="calculate" onclick="finalGrade()" style="font-weight: bold;">Calculate Semester Grade</button>
    </div>
</div>
</body>

</html>
